{% extends "base.html" %}
{% block titolo %}Accesso{% endblock %}
{% block contenuto %}
<div class="riquadro-stretto">
  <h1>Cornice digitale</h1>
  <p class="sottotitolo">Inserisci la password per gestire le foto.</p>
  <form method="post">
    <input type="hidden" name="csrf" value="{{ csrf }}">
    <input type="hidden" name="prossima" value="{{ prossima }}">
    <label for="password">Password</label>
    <input id="password" name="password" type="password" autocomplete="current-password" autofocus required>
    <button type="submit" class="primario">Entra</button>
  </form>
</div>
{% endblock %}
